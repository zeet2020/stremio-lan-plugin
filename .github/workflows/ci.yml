name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        run: cd web && npm ci && npx oxlint src && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test (service build)
        run: |
          go vet ./...
          go test ./...
      - name: Desktop build compiles (Windows, no CGO needed)
        run: GOOS=windows CGO_ENABLED=0 go vet -tags desktop .
